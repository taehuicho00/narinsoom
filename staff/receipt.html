<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나린숨 직원용 · 간이영수증</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f6f3ee;--card:#fff;--ink:#2b2a27;--sub:#7a756c;--line:#e6e0d6;--accent:#3f6b4f;--accent-soft:#e7efe9;--bad:#c0392b;--bad-soft:#fdecea;
        /* 영수증 종이는 다크모드에서도 흰 종이 */
        --paper:#fff;--paper-ink:#1a1a1a;--rule:#b23a2e;--rule-soft:#f7e9e6;}
  @media (prefers-color-scheme: dark){:root{--bg:#1c1c1a;--card:#262624;--ink:#eeeae2;--sub:#a8a296;--line:#3a3935;--accent:#7fb08f;--accent-soft:#2c3a30;--bad:#e57366;--bad-soft:#3a2420;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  .top{display:flex;justify-content:space-between;align-items:baseline}
  .brand{font-size:13px;letter-spacing:.2em;color:var(--sub)}
  h1{font-size:22px;margin:2px 0 14px}
  h2{font-size:15px;margin:0 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit;min-width:0}
  [hidden]{display:none !important}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .two > div{min-width:0}
  .two input{height:46px;display:block;max-width:100%}
  /* 아이폰 사파리 날짜 칸: 기본 모양을 지워 받는 분 칸과 같은 크기로 */
  input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;line-height:1.3;text-align:left}
  input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
  input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
  .ihead,.irow{display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,.45fr);gap:8px;align-items:center}
  .ihead{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px}
  .irow{margin-bottom:8px;font-weight:600;font-size:15px}
  .won{display:flex;align-items:center;gap:6px}
  .won input{text-align:right;font-variant-numeric:tabular-nums;height:46px}
  .won span{color:var(--sub);font-weight:500;font-size:14px}
  .irow .memo{height:46px;padding:10px 8px}
  .sub{font-size:12px;color:var(--sub);margin:2px 0 0}
  .total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .total b{font-size:22px;font-variant-numeric:tabular-nums}
  .submit{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;margin-top:12px}
  .submit:disabled{opacity:.5}
  .ghost{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:14px;margin-top:8px}
  .err{color:var(--bad);font-size:13px;margin-top:8px}
  .note{font-size:12px;color:var(--sub);text-align:center;margin-top:20px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}

  /* 미리보기 */
  .phead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
  .phead h2{margin:0}
  #previewImg{display:block;width:100%;border:1px solid #d9d6cf}
  .hint{font-size:12px;color:var(--sub);text-align:center;margin:8px 0 0}

  /* ── 영수증 종이 ── */
  #rcpt{background:var(--paper);color:var(--paper-ink);width:100%;padding:18px 14px 14px;font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;font-size:12px;line-height:1.4;border:1px solid #d9d6cf}
  #rcpt .r-top{display:flex;justify-content:flex-end;font-size:11px;margin-bottom:4px}
  #rcpt .r-title{text-align:center;font-size:22px;font-weight:700;letter-spacing:.6em;padding-left:.6em;color:var(--rule);margin:2px 0}
  #rcpt .r-sub{text-align:center;font-size:11px;color:var(--rule);margin-bottom:10px}
  #rcpt .r-to{font-size:15px;border-bottom:1.5px solid var(--rule);padding-bottom:3px;margin-bottom:10px;display:flex;justify-content:flex-end;gap:8px}
  #rcpt .r-to span:first-child{flex:1;text-align:right;font-weight:700}
  #rcpt table{width:100%;border-collapse:collapse;table-layout:fixed}
  #rcpt td,#rcpt th{border:1px solid var(--rule);padding:5px 6px;vertical-align:middle;overflow-wrap:anywhere;height:26px}
  #rcpt th{background:var(--rule-soft);color:var(--rule);font-weight:600;font-size:11px;text-align:center}
  #rcpt .v-head{writing-mode:vertical-rl;letter-spacing:.4em}
  #rcpt .amt-row td{font-size:14px;font-weight:700;text-align:center;padding:9px 6px}
  #rcpt .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #rcpt .c{text-align:center}
  #rcpt .seal{color:var(--rule);font-size:11px}
  #rcpt .seal-wrap{position:relative;display:inline-block;margin-left:10px}
  #rcpt .seal-wrap img{position:absolute;left:50%;top:50%;width:auto;height:auto;max-height:16px;max-width:26px;transform:translate(-50%,-50%)}
  #rcpt .r-foot{text-align:center;font-size:14px;font-weight:700;margin:12px 0 4px}
  #rcpt .r-contact{text-align:center;font-size:11px;color:#555}
  #rcpt .gap{height:8px}
  /* 발행 내역 */
  .hhead{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 8px}
  .hhead h2{margin:0}
  .rec .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .rec .who{font-weight:700;overflow-wrap:anywhere}
  .rec .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rec .meta{font-size:12px;color:var(--sub);margin-top:2px}
  .rec .acts{display:flex;gap:6px;margin-top:10px}
  .rec .acts button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px}
  .rec .acts .del{flex:0 0 auto;padding:9px 12px;color:var(--sub)}
  .rec .acts .del.sure{color:#fff;background:var(--bad);border-color:var(--bad)}
  .empty{text-align:center;color:var(--sub);padding:24px;font-size:14px}
  @media (max-width:420px){ .ihead,.irow{grid-template-columns:62px minmax(0,1fr) minmax(0,.45fr);gap:6px} #rcpt{font-size:11px;padding:14px 10px 12px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">NARINSOOM · STAFF</div><span class="brand" id="clock"></span></div>
  <h1>간이영수증</h1>

  <section class="card">
    <div class="two">
      <div><label for="to">받는 분</label><input id="to" maxlength="30" placeholder="성함 또는 회사명" autocomplete="off"></div>
      <div><label for="date">작성일</label><input id="date" type="date"></div>
    </div>
    <div class="ihead"><span>품목</span><span>금액</span><span>비고</span></div>
    <div id="items"></div>
    <p class="sub">해당 없는 항목은 비워 두세요.</p>
    <div class="total"><span>합계</span><b id="sum">0원</b></div>
    <button class="submit" type="button" id="issue">영수증 이미지 만들기</button>
    <button class="ghost" type="button" id="reset">새로 작성</button>
    <div class="err" id="err" hidden></div>
  </section>

  <div class="phead"><h2 id="pTitle">미리보기</h2></div>
  <div id="rcpt"></div>
  <img id="previewImg" alt="간이영수증 이미지" hidden>
  <p class="hint" id="pHint" hidden>이미지를 길게 눌러 저장·공유할 수도 있어요. 내용을 고치면 다시 미리보기로 돌아갑니다.</p>

  <div class="hhead"><h2>발행 내역</h2><span class="sub" id="hCount"></span></div>
  <div id="hist"><div class="empty">불러오는 중…</div></div>

</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/config.js"></script>
<script src="./nav.js"></script>
<script>
const sb = supabase.createClient(CONFIG.url, CONFIG.key);
const $ = id => document.getElementById(id);

// 다른 직원 화면과 같은 기기 토큰 → 없으면 입실 현황(로그인)으로
const TOKEN_KEY = "narinsoom_staff_token";
let token = null; try { token = localStorage.getItem(TOKEN_KEY); } catch {}
if(!token) location.href = "./";

// 사업자 정보 (고정)
const BIZ = { name:"나린숨", owner:"조태희", reg:"190-14-02462", addr:"경기도 양평군 용문면 448-15", type:"숙박 및 음식점업", item:"민박업", tel:"010-9455-9321" };
// 품목 (고정)
const ITEMS = ["숙박","추가인원","애견동반","숯/그릴"];

let sig = null;        // 영수증에 넣는 서명 (굵게 처리한 이미지)
let issued = false;    // 이미지가 만들어진 상태인지
let lastBlob = null, lastName = "";

const won = n => (Math.round(n) || 0).toLocaleString("ko-KR");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2000); }

// 금액 → 한글 (150000 → 일십오만)
function korAmt(n){
  n = Math.floor(n); if(!n) return "영";
  const d = ["","일","이","삼","사","오","육","칠","팔","구"], u = ["","십","백","천"], big = ["","만","억","조"];
  let s = "", i = 0;
  while(n > 0){ const ch = n % 10000; if(ch){ let c = "", k = ch, j = 0; while(k > 0){ const g = k % 10; if(g) c = d[g] + u[j] + c; k = Math.floor(k/10); j++; } s = c + big[i] + s; } n = Math.floor(n/10000); i++; }
  return s;
}

// ── 품목 입력 ──
function buildItems(vals = {}){
  $("items").textContent = "";
  ITEMS.forEach(name => {
    const row = document.createElement("div"); row.className = "irow";
    const lb = document.createElement("span"); lb.textContent = name;
    const w = document.createElement("div"); w.className = "won";
    const p = document.createElement("input"); p.className = "price"; p.inputMode = "numeric"; p.placeholder = "0"; p.dataset.name = name; p.setAttribute("aria-label", name + " 금액");
    const v0 = vals[name] || {}; if(v0.price) p.value = won(v0.price);
    p.addEventListener("input", () => { const v = p.value.replace(/\D/g, ""); p.value = v ? won(+v) : ""; update(); });
    const u = document.createElement("span"); u.textContent = "원";
    const m = document.createElement("input"); m.className = "memo"; m.maxLength = 20; m.placeholder = "비고"; m.setAttribute("aria-label", name + " 비고"); m.value = v0.memo || "";
    m.addEventListener("input", update);
    w.append(p, u); row.append(lb, w, m); $("items").appendChild(row);
  });
}
function readItems(){
  return [...$("items").children].map(row => {
    const p = row.querySelector(".price");
    return { name: p.dataset.name, price: +(p.value.replace(/\D/g, "")) || 0, memo: row.querySelector(".memo").value.trim() };
  }).filter(x => x.price);
}
function draft(){
  const items = readItems();
  return { to: $("to").value.trim(), date: $("date").value || today(), items, total: items.reduce((s, x) => s + x.price, 0) };
}

// 미리보기 ↔ 이미지 상태 전환
function setIssued(on, title){
  issued = on;
  $("rcpt").hidden = on; $("previewImg").hidden = !on; $("pHint").hidden = !on;
  $("pTitle").textContent = on ? title : "미리보기";
  $("issue").textContent = on ? "이미지 저장" : "영수증 이미지 만들기";
}
function update(){
  if(issued) setIssued(false);
  const d = draft();
  $("sum").textContent = won(d.total) + "원";
  renderReceipt(d);
}

// ── 영수증 그리기 (값은 모두 textContent) ──
function el(tag, attrs, text){ const e = document.createElement(tag); if(attrs) for(const k in attrs){ if(k === "cls") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } if(text != null) e.textContent = text; return e; }
const tr = (...cells) => { const t = el("tr"); cells.forEach(c => t.appendChild(c)); return t; };
const th = (t, a) => el("th", a, t);
const td = (t, a) => el("td", a, t);
function cols(table, widths){ const g = el("colgroup"); widths.forEach(w => { const c = el("col"); if(w) c.style.width = w; g.appendChild(c); }); table.appendChild(g); }

function renderReceipt(r){
  const p = $("rcpt"); p.textContent = "";
  const top = el("div", {cls:"r-top"}); top.append(el("span", null, "(공급받는자용)"));
  p.append(top, el("div", {cls:"r-title"}, "영수증"), el("div", {cls:"r-sub"}, "RECEIPT"));
  const to = el("div", {cls:"r-to"}); to.append(el("span", null, r.to || " "), el("span", null, "귀하")); p.appendChild(to);

  const t1 = el("table"); cols(t1, ["26px","22%","","20%",""]);
  t1.appendChild(tr(th("공급자", {cls:"v-head", rowspan:"4"}), th("사업자등록번호"), td(BIZ.reg, {colspan:"3", cls:"c"})));
  const ownerTd = td(BIZ.owner);
  const sw = el("span", {cls:"seal-wrap"}); sw.appendChild(el("span", {cls:"seal"}, "(인)"));
  if(sig){ const im = el("img", {alt:"서명"}); im.src = sig; sw.appendChild(im); }
  ownerTd.appendChild(sw);
  t1.appendChild(tr(th("상호"), td(BIZ.name), th("성명"), ownerTd));
  t1.appendChild(tr(th("사업장소재지"), td(BIZ.addr, {colspan:"3"})));
  t1.appendChild(tr(th("업태"), td(BIZ.type), th("종목"), td(BIZ.item)));
  p.appendChild(t1);

  p.appendChild(el("div", {cls:"gap"}));
  const t2 = el("table");
  const [y, m, dd] = r.date.split("-");
  t2.appendChild(tr(th("작성년월일"), th("공급대금총액")));
  t2.appendChild(tr(td(`${y}. ${+m}. ${+dd}.`, {cls:"c"}), td("₩" + won(r.total), {cls:"c"})));
  const amt = tr(td(`금 ${korAmt(r.total)}원정  (₩${won(r.total)})`, {colspan:"2"})); amt.className = "amt-row"; t2.appendChild(amt);
  p.appendChild(t2);

  p.appendChild(el("div", {cls:"gap"}));
  const t3 = el("table"); cols(t3, ["14%","24%","24%","38%"]);
  t3.appendChild(tr(th("월일"), th("품목"), th("금액"), th("비고")));
  const md = `${+m}/${+dd}`;
  const rows = r.items.slice(); while(rows.length < 4) rows.push(null);
  rows.forEach(x => {
    if(!x) return t3.appendChild(tr(td(" "), td(" "), td(" "), td(" ")));
    t3.appendChild(tr(td(md, {cls:"c"}), td(x.name, {cls:"c"}), td(won(x.price), {cls:"n"}), td(x.memo, {cls:"c"})));
  });
  const sum = tr(th("합계", {colspan:"2"}), td(won(r.total), {cls:"n"}), td("")); sum.children[1].style.fontWeight = "700"; t3.appendChild(sum);
  p.appendChild(t3);

  p.appendChild(el("div", {cls:"r-foot"}, "위 금액을 정히 영수함."));
  p.appendChild(el("div", {cls:"r-contact"}, BIZ.name + "  ·  " + BIZ.tel));
}

// ── 이미지 만들기 / 저장 ──
async function makeImage(r){
  renderReceipt(r);
  if(!window.html2canvas) throw new Error("nolib");
  try { await document.fonts.ready; } catch {}
  const node = $("rcpt");
  const canvas = await html2canvas(node, { scale: Math.max(2, Math.ceil(1040 / node.offsetWidth)), backgroundColor: "#ffffff", logging: false });
  const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
  if(lastBlob) URL.revokeObjectURL($("previewImg").src);
  lastBlob = blob;
  lastName = `나린숨_영수증_${r.date.replace(/-/g, "")}_${(r.to || "손님").replace(/[\\/:*?"<>|\s]+/g, "")}.png`;
  $("previewImg").src = URL.createObjectURL(blob);
  setIssued(true, `${r.to || "받는 분 미입력"} · ${won(r.total)}원`);
}
async function saveImage(){
  if(!lastBlob) return;
  const file = new File([lastBlob], lastName, { type: "image/png" });
  // 휴대폰: 공유 창(카톡·사진 저장 등) / PC: 파일 다운로드
  if(navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], title: "나린숨 영수증" }); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(lastBlob); a.download = lastName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("이미지를 저장했습니다");
}

$("issue").onclick = async () => {
  if(issued) return saveImage();
  const err = $("err"); err.hidden = true;
  const d = draft();
  if(!d.items.length){ err.textContent = "품목 금액을 하나 이상 입력해 주세요."; err.hidden = false; return; }
  $("issue").disabled = true; $("issue").textContent = "만드는 중…";
  try { await makeImage(d); saveRecord(d); }
  catch(e){ err.textContent = e && e.message === "nolib" ? "이미지 도구를 불러오지 못했어요. 새로고침해 주세요." : "이미지를 만들지 못했어요. 다시 시도해 주세요."; err.hidden = false; setIssued(false); }
  finally { $("issue").disabled = false; }
};
$("reset").onclick = () => { $("to").value = ""; $("date").value = today(); buildItems(); $("err").hidden = true; update(); };
["to","date"].forEach(id => $(id).addEventListener("input", update));

// ── 서명: 고정 파일(sign.png) ──
// 서명 선을 굵게
function thicken(src){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const r = Math.max(2, Math.round(im.height/30)), c = document.createElement("canvas");
      c.width = im.width + r*2; c.height = im.height + r*2; const x = c.getContext("2d");
      for(let a = 0; a < 16; a++){ const t = a/16*Math.PI*2; x.drawImage(im, r + Math.cos(t)*r, r + Math.sin(t)*r); }
      x.drawImage(im, r, r);
      x.globalCompositeOperation = "source-in"; x.fillStyle = "#111"; x.fillRect(0, 0, c.width, c.height);
      res(c.toDataURL("image/png"));
    };
    im.onerror = () => res(src); im.src = src;
  });
}
async function loadSig(){
  sig = await thicken("./sign.png");
  update();
}

// ── 발행 내역 (Supabase) ──
let HIST = [], sure = null;
const failedToken = error => String(error && error.message).includes("invalid_token") && (location.href = "./");
async function saveRecord(d){
  const { error } = await sb.rpc("staff_receipt_add", { p_token: token, p_to: d.to, p_date: d.date, p_items: d.items });
  if(error){ if(failedToken(error)) return; toast("내역 저장 실패: " + error.message); return; }
  loadHist();
}
async function loadHist(){
  const { data, error } = await sb.rpc("staff_receipt_list", { p_token: token });
  if(error){
    if(failedToken(error)) return;
    $("hist").innerHTML = "";
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = /could not find|does not exist|PGRST202/i.test(error.message + (error.code || "")) ? "발행 내역 DB가 아직 설정되지 않았습니다 (015_receipt.sql 실행 필요)." : "내역을 불러오지 못했습니다.";
    $("hist").appendChild(e); return;
  }
  HIST = data || []; renderHist();
}
function renderHist(){
  const box = $("hist"); box.textContent = "";
  $("hCount").textContent = HIST.length ? `최근 1년 ${HIST.length}건` : "";
  if(!HIST.length){ const e = document.createElement("div"); e.className = "empty"; e.textContent = "아직 발행한 영수증이 없습니다."; box.appendChild(e); return; }
  HIST.forEach(r => {
    const c = document.createElement("div"); c.className = "card rec";
    const r1 = document.createElement("div"); r1.className = "r1";
    const who = document.createElement("span"); who.className = "who"; who.textContent = r.to_name || "받는 분 미입력";
    const amt = document.createElement("span"); amt.className = "amt"; amt.textContent = won(r.total) + "원";
    r1.append(who, amt);
    const meta = document.createElement("div"); meta.className = "meta";
    const dt = new Date(r.created_at);
    meta.textContent = `작성일 ${r.issue_date.replace(/-/g, ".")} · ${(r.items || []).map(x => x.name + (x.memo ? `(${x.memo})` : "")).join(", ")} · 발행 ${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
    const acts = document.createElement("div"); acts.className = "acts";
    const mk = (label, fn, cls) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; if(cls) b.className = cls; b.onclick = fn; acts.appendChild(b); };
    const rec = { to: r.to_name || "", date: r.issue_date, items: r.items || [], total: r.total };
    mk("이미지 다시 만들기", async () => { try { await makeImage(rec); $("pTitle").scrollIntoView({ behavior:"smooth", block:"start" }); } catch { toast("이미지를 만들지 못했어요"); } });
    mk("복사해서 작성", () => {
      $("to").value = rec.to; $("date").value = today();
      const v = {}; rec.items.forEach(x => { v[x.name] = { price: x.price, memo: x.memo }; });
      buildItems(v); update(); window.scrollTo({ top: 0, behavior: "smooth" });
    });
    mk(sure === r.id ? "정말 삭제" : "삭제", async () => {
      if(sure !== r.id){ sure = r.id; renderHist(); setTimeout(() => { if(sure === r.id){ sure = null; renderHist(); } }, 4000); return; }
      sure = null;
      const { error } = await sb.rpc("staff_receipt_delete", { p_token: token, p_id: r.id });
      if(error){ if(failedToken(error)) return; toast("삭제 실패: " + error.message); return; }
      toast("삭제했습니다"); loadHist();
    }, "del" + (sure === r.id ? " sure" : ""));
    c.append(r1, meta, acts); box.appendChild(c);
  });
}

// 시작
$("date").value = today();
buildItems();
loadSig();
if(token) loadHist();
const tick = () => { const d = new Date(); $("clock").textContent = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
tick(); setInterval(tick, 1000);
</script>
</body>
