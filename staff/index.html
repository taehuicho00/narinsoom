<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나린숨 직원용</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f6f3ee;--card:#fff;--ink:#2b2a27;--sub:#7a756c;--line:#e6e0d6;--accent:#3f6b4f;--accent-soft:#e7efe9;--warn:#b5651d;--warn-soft:#fbeee2;--bad:#c0392b;}
  @media (prefers-color-scheme: dark){:root{--bg:#1c1c1a;--card:#262624;--ink:#eeeae2;--sub:#a8a296;--line:#3a3935;--accent:#7fb08f;--accent-soft:#2c3a30;--warn:#e0a060;--warn-soft:#3a2f24;--bad:#e57366;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  .top{display:flex;justify-content:space-between;align-items:baseline}
  .brand{font-size:13px;letter-spacing:.2em;color:var(--sub)}
  h1{font-size:22px;margin:2px 0 14px}
  .weekbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
  .nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
  .day{padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center;position:relative}
  .day small{display:block;font-size:11px;color:var(--sub)}
  .day b{font-size:16px}
  .day .cnt{display:block;font-size:11px;color:var(--sub);min-height:16px}
  .day.today{border-color:var(--accent)}
  .day.on{background:var(--ink);border-color:var(--ink)}
  .day.on small,.day.on b,.day.on .cnt{color:var(--bg)}
  .day.sat small{color:#3b6fb6} .day.sun small{color:var(--bad)}
  .day .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:12px;color:var(--sub)}
  .stat.alert b{color:var(--warn)}
  .filter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .fchip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px}
  .fchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
  .card.pending{border-left:5px solid var(--warn)}
  .card.done{border-left:5px solid var(--accent)}
  .row1{display:flex;justify-content:space-between;align-items:center}
  .room{font-size:18px;font-weight:700}
  .badge{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600}
  .badge.ok{background:var(--accent-soft);color:var(--accent)}
  .badge.wait{background:var(--warn-soft);color:var(--warn)}
  .who{color:var(--sub);font-size:13px;margin:2px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
  .grid div{background:var(--bg);border-radius:10px;padding:6px 2px}
  .grid small{display:block;color:var(--sub);font-size:11px}
  .grid b{font-size:15px}
  .tel{color:var(--accent);font-weight:600;text-decoration:none}
  .nophone{color:var(--warn)}
  .card.call{border-left-color:var(--bad)}
  .badge.call{background:#fdecea;color:var(--bad)}
  .btn.hold{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
  .btn.link{text-align:center;text-decoration:none;display:block}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .blockmemo{background:#fff4e5;color:#6b4a00}
  .memo{margin-top:8px;font-size:13px;background:var(--bg);border-radius:10px;padding:8px 10px}
  .fee{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
  .fee .line{display:flex;justify-content:space-between;color:var(--sub)}
  .fee .tot{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-top:4px}
  .err{color:var(--bad);font-size:13px;margin-top:6px}
  .actions{display:flex;gap:6px;margin-top:10px}
  .btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px}
  .btn.paid{background:var(--accent);color:#fff;border-color:var(--accent)}
  .empty{text-align:center;color:var(--sub);padding:30px}
  .note{font-size:12px;color:var(--sub);text-align:center;margin-top:20px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s}
  .toast.show{opacity:1}
  .login{max-width:360px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
  .login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;margin-bottom:10px}
  .login button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
  .pin{text-align:center;font-size:28px !important;letter-spacing:.5em}
  .hint{font-size:12px;color:var(--sub);margin-top:10px;text-align:center}
  .logout{border:0;background:none;color:var(--sub);font-size:12px;text-decoration:underline}
  .hidden{display:none !important}
</style>
</head>
<body>
<!-- 로그인 화면 -->
<form class="login hidden" id="loginBox">
  <div class="brand">NARINSOOM · STAFF</div>
  <h1>비밀번호 4자리</h1>
  <input type="password" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="● ● ● ●" class="pin">
  <button type="submit" id="loginBtn">확인</button>
  <div class="err hidden" id="loginErr"></div>
  <div class="hint">한 번 입력하면 이 기기에서는 30일간 다시 묻지 않습니다.</div>
</form>

<!-- 직원 화면 -->
<div class="wrap hidden" id="main">
  <div class="top"><div class="brand">NARINSOOM · STAFF</div><div><span class="brand" id="clock"></span> <button class="logout" id="logout">잠금</button></div></div>
  <h1>입실 현황</h1>
  <div class="weekbar"><button class="nav" id="prev">‹</button><span id="weekLabel"></span><button class="nav" id="next">›</button></div>
  <div class="week" id="week"></div>
  <div class="filter" id="filter">
    <button class="fchip on" data-f="all">전체</button>
    <button class="fchip" data-f="wait">미응답만</button>
    <button class="fchip" data-f="unpaid">미입금만</button>
  </div>
  <div id="list"></div>
  <div class="note" id="updated"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/config.js"></script>
<script>
const sb = supabase.createClient(CONFIG.url, CONFIG.key);
const $ = id => document.getElementById(id);
// 손님이 쓴 글(요청사항)을 화면에 넣을 때 HTML로 해석되지 않게 막기
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// ── 요금표: narinsum_bot/config.py 와 동일 (기준 인원·반려견 가능 여부는 DB rooms 표에서 읽음) ──
let ROOMS = {};
const EXTRA_PERSON_PER_NIGHT = 20000, PET_FEE = 20000, BBQ_BASE = 20000, BBQ_BASE_PEOPLE = 4, BBQ_EXTRA_PER_PERSON = 5000;

// ── 추가요금 계산: pricing.py 와 같은 규칙 ──
// 손님 응답이 우선, 없으면 방막기 메모에서 확실히 읽은 값 사용
function known(r){
  const a = r.answer;
  return {
    people: a ? a.people : r.memo_people,
    pets: a ? a.pets : r.memo_pets,
    bbq: a ? !!a.bbq : false,
    fromMemo: !a,
  };
}
function calcCharges(r){
  const a = known(r), out = [];
  if(a.people == null && a.pets == null) return { items:[], total:0 };
  const room = ROOMS[r.room] || { base_people:0, max_pets:0 };
  const extra = a.people == null ? 0 : Math.max(0, a.people - room.base_people);
  if(extra) out.push([`추가 인원 ${extra}명${r.nights>1?` × ${r.nights}박`:""}`, extra*EXTRA_PERSON_PER_NIGHT*r.nights]);
  let error = null;
  if(a.pets){
    if(!room.max_pets) error = `${r.room}은 반려견 불가 객실인데 ${a.pets}마리로 응답 — 직접 확인 필요`;
    else out.push([`반려견 ${a.pets}마리`, a.pets*PET_FEE]);
  }
  if(a.bbq && r.bbq_prepaid){
    out.push([`숯불 (결제 완료)`, 0]);
  } else if(a.bbq){
    const over = Math.max(0, a.people - BBQ_BASE_PEOPLE);
    out.push([`숯불 (${a.people}인)`, BBQ_BASE + over*BBQ_EXTRA_PER_PERSON]); // 특이사항 없으면 1회
  }
  return { items:out, total:out.reduce((s,[,v])=>s+v,0), error };
}

const ORDER = ["1호실","2호실","3호실","4호실","별채"];
function addDays(ymd, n){ const d=new Date(ymd+"T00:00:00"); d.setDate(d.getDate()+n); return fmt(d); }
function fmt(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const todayStr = fmt(new Date());
let weekStart = addDays(todayStr, -((new Date().getDay()+6)%7));  // 이번 주 월요일
let sel = todayStr, filter = "all", DATA = [];
const won = n => n.toLocaleString("ko-KR") + "원";
const hm = t => t ? t.slice(0,5) : "";  // "16:30:00" → "16:30"

// ── 이번 주 예약 + 손님 응답 불러오기 ──
// 이 기기에 저장된 토큰 (비밀번호 원문은 저장하지 않음)
const TOKEN_KEY = "narinsoom_staff_token";
const getToken = () => { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } };
const setToken = t => { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} };
let memToken = getToken();

async function load(){
  const { data, error } = await sb.rpc("staff_week", { p_token: memToken, p_from: weekStart, p_to: addDays(weekStart, 6) });
  if(error){
    if(String(error.message).includes("invalid_token")) return showLogin();
    toast("불러오기 실패: " + error.message); return;
  }
  ROOMS = Object.fromEntries(data.rooms.map(x=>[x.name,x]));
  DATA = data.reservations.map(r => {
    const s = r.response;
    return { ...r, answer: s ? { people:s.people, pets:s.pets, time:hm(s.checkin_time), bbq:hm(s.bbq_time), memo:s.memo, phone:s.phone } : null };
  });
  $("updated").textContent = `마지막 업데이트 ${new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})} · 1분마다 자동 새로고침`;
  render();
}

function render(){
  renderWeek();
  const today = DATA.filter(r=>r.checkin===sel).sort((a,b)=>ORDER.indexOf(a.room)-ORDER.indexOf(b.room));
  const shown = today.filter(r => filter==="all" || (filter==="wait" && !r.answer) || (filter==="unpaid" && calcCharges(r).total>0 && !r.paid));
  if(!shown.length){ $("list").innerHTML = `<div class="empty">해당하는 예약이 없습니다.</div>`; return; }

  $("list").innerHTML = shown.map(r=>{
    const a = r.answer, c = calcCharges(r);
    // 입실 당일 13시가 지나도 미응답이면 직원이 전화
    const callNow = !a && r.checkin===todayStr && new Date().getHours() >= 13;
    const entryUrl = `../?c=${encodeURIComponent(r.code)}&staff=1`;
    return `<div class="card ${a?"done":"pending"} ${callNow?"call":""}">
      <div class="row1"><span class="room">${esc(r.room)}</span>
        <span class="badge ${a?"ok":callNow?"call":"wait"}">${a?"응답 완료":callNow?"📞 전화 필요":"미응답"}</span></div>
      <div class="who">${esc(r.guest_name|| (r.source==="block" ? "이름 미기재" : ""))} · ${r.nights}박${(()=>{ // 손님이 준 실번호 > PMS 실번호 > 안심번호 순
        const real = a?.phone || (!r.need_phone && r.pms_phone);
        if(real) return ` · <a class="tel" href="tel:${esc(real)}">📞 ${esc(real)}</a>`;
        if(r.pms_phone) return ` · <a class="tel" href="tel:${esc(r.pms_phone)}">📞 ${esc(r.pms_phone)}</a> <span class="nophone">(안심번호)</span>`;
        return ` · <span class="nophone">번호 없음</span>`; })()}</div>
      ${r.source==="block" ? `<div class="memo blockmemo">📌 방막기 메모: ${esc(r.pms_memo||"")}</div>`
        : r.pms_memo ? `<div class="memo">📋 ${esc(r.pms_memo)}</div>` : ""}
      ${a ? `
        <div class="grid">
          <div><small>인원</small><b>${a.people}명</b></div>
          <div><small>반려견</small><b>${a.pets?a.pets+"마리":"없음"}</b></div>
          <div><small>입실</small><b>${a.time}</b></div>
          <div><small>숯불</small><b>${a.bbq||"안 함"}</b></div>
        </div>
        ${a.memo?`<div class="memo">💬 ${esc(a.memo)}</div>`:""}
        ${c.error?`<div class="err">⚠ ${esc(c.error)}</div>`:""}
        <div class="fee">
          ${c.items.length ? c.items.map(([l,v])=>`<div class="line"><span>${l}</span><span>${won(v)}</span></div>`).join("") : `<div class="line"><span>추가요금 없음</span><span>0원</span></div>`}
          ${c.items.length?`<div class="tot"><span>추가요금 합계</span><span>${won(c.total)}</span></div>`:""}
        </div>
        <div class="actions">
          ${c.total ? `<button class="btn ${r.paid?"paid":""}" data-pay="${r.id}">${r.paid?"✓ 입금 확인됨":"입금 확인"}</button>
          ${r.paid ? "" : `<button class="btn ${r.fee_hold?"hold":""}" data-hold="${r.id}">${r.fee_hold?"⏸ 문자 보류 중":"추가요금 문자 보류"}</button>`}` : ""}
          <a class="btn link" href="${entryUrl}" target="_blank">내용 수정</a>
        </div>
      ` : `${(r.memo_people != null || r.bbq_prepaid) ? `
        <div class="grid">
          <div><small>인원</small><b>${r.memo_people != null ? r.memo_people+"명" : "—"}</b></div>
          <div><small>반려견</small><b>${r.memo_pets == null ? "—" : r.memo_pets ? r.memo_pets+"마리" : "없음"}</b></div>
          <div><small>입실</small><b>미정</b></div>
          <div><small>숯불</small><b>${r.bbq_prepaid ? "결제 완료" : "—"}</b></div>
        </div>
        ${(()=>{ const c2 = calcCharges(r); return c2.items.length ? `<div class="fee">${c2.items.map(([l,v])=>`<div class="line"><span>${l}</span><span>${won(v)}</span></div>`).join("")}<div class="tot"><span>메모 기준 추가요금</span><span>${won(c2.total)}</span></div></div>` : ""; })()}
        <div class="memo">메모로 확인된 내용입니다. 입실 시간 등은 손님 응답을 기다리는 중입니다.</div>` :
        `<div class="memo">아직 손님 응답이 없습니다.${callNow?" 전화로 확인 후 직접 입력해 주세요.":""}</div>`}
        <div class="actions"><a class="btn link primary" href="${entryUrl}" target="_blank">✏️ 직접 입력</a></div>`}
    </div>`;
  }).join("");
}

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }

// ── 주간 달력: 월~일, ‹ › 로 주 이동 ──
function renderWeek(){
  const mon = weekStart, sun = addDays(weekStart, 6);
  $("weekLabel").textContent = `${+mon.slice(5,7)}/${+mon.slice(8)} ~ ${+sun.slice(5,7)}/${+sun.slice(8)}`;
  $("week").innerHTML = [0,1,2,3,4,5,6].map(i=>{
    const d = addDays(weekStart, i), list = DATA.filter(r=>r.checkin===d);
    const wait = list.some(r=>!r.answer);
    return `<button class="day ${d===sel?"on":""} ${d===todayStr?"today":""} ${i===5?"sat":""} ${i===6?"sun":""}" data-day="${d}">
      ${wait?'<span class="dot"></span>':""}<small>${"월화수목금토일"[i]}</small><b>${+d.slice(8)}</b><span class="cnt">${list.length?list.length+"팀":""}</span></button>`;
  }).join("");
}
$("week").onclick = e=>{ const b=e.target.closest(".day"); if(!b) return; sel=b.dataset.day; render(); };
// 주를 옮기면: 이번 주면 오늘, 다른 주면 월요일 선택
const moveWeek = n => { weekStart=addDays(weekStart,n); sel = (todayStr>=weekStart && todayStr<=addDays(weekStart,6)) ? todayStr : weekStart; load(); };
$("prev").onclick = ()=>moveWeek(-7);
$("next").onclick = ()=>moveWeek(7);
$("filter").onclick = e=>{
  const b=e.target.closest(".fchip"); if(!b) return;
  filter=b.dataset.f; document.querySelectorAll(".fchip").forEach(x=>x.classList.toggle("on",x===b)); render();
};
// 입금 확인 토글 → DB 저장
$("list").onclick = async e=>{
  const hold=e.target.closest("[data-hold]");
  if(hold){
    const r=DATA.find(x=>x.id===hold.dataset.hold); const v=!r.fee_hold;
    const { error } = await sb.rpc("staff_set_hold", { p_token: memToken, p_id: r.id, p_hold: v });
    if(error){ if(String(error.message).includes("invalid_token")) return showLogin(); return toast("저장 실패: " + error.message); }
    r.fee_hold=v; render(); return toast(v ? "20시 추가요금 문자에서 제외합니다" : "보류를 풀었습니다");
  }
  const pay=e.target.closest("[data-pay]"); if(!pay) return;
  const r=DATA.find(x=>x.id===pay.dataset.pay); const v=!r.paid;
  const { error } = await sb.rpc("staff_set_paid", { p_token: memToken, p_id: r.id, p_paid: v });
  if(error){ if(String(error.message).includes("invalid_token")) return showLogin(); return toast("저장 실패: " + error.message); }
  r.paid=v; render(); toast(v ? "입금 확인 저장됨" : "입금 확인 취소됨");
};

// ── 비밀번호 ──
function showLogin(){
  setToken(null); memToken = null;
  $("main").classList.add("hidden"); $("loginBox").classList.remove("hidden");
  $("pin").value = ""; $("pin").focus();
}
function showMain(){ $("loginBox").classList.add("hidden"); $("main").classList.remove("hidden"); load(); }

async function tryLogin(){
  const pin = $("pin").value;
  if(!/^\d{4}$/.test(pin)) return;
  $("loginErr").classList.add("hidden");
  $("loginBtn").disabled = true; $("loginBtn").textContent = "확인 중…";
  const { data, error } = await sb.rpc("staff_login", { p_pin: pin });
  $("loginBtn").disabled = false; $("loginBtn").textContent = "확인";
  if(error){ $("loginErr").textContent = error.message; $("loginErr").classList.remove("hidden"); $("pin").value=""; return; }
  memToken = data; setToken(data); showMain();
}
$("loginBox").onsubmit = e => { e.preventDefault(); tryLogin(); };
// 4자리를 다 누르면 자동 확인
$("pin").oninput = e => { e.target.value = e.target.value.replace(/\D/g,"").slice(0,4); if(e.target.value.length===4) tryLogin(); };
$("logout").onclick = async ()=>{ await sb.rpc("staff_logout", { p_token: memToken }); showLogin(); };

if(memToken) showMain(); else showLogin();
setInterval(()=>{ if(!$("main").classList.contains("hidden")) load(); }, 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !$("main").classList.contains("hidden")) load(); });
const tick = ()=>{ const d=new Date(); $("clock").textContent=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
tick(); setInterval(tick, 1000);
</script>
