<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나린숨 직원용 · 구매요청</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f6f3ee;--card:#fff;--ink:#2b2a27;--sub:#7a756c;--line:#e6e0d6;--accent:#3f6b4f;--accent-soft:#e7efe9;--warn:#b5651d;--warn-soft:#fbeee2;--bad:#c0392b;--bad-soft:#fdecea;--naver:#0a8f44;--coupang:#c2410c;}
  @media (prefers-color-scheme: dark){:root{--bg:#1c1c1a;--card:#262624;--ink:#eeeae2;--sub:#a8a296;--line:#3a3935;--accent:#7fb08f;--accent-soft:#2c3a30;--warn:#e0a060;--warn-soft:#3a2f24;--bad:#e57366;--bad-soft:#3a2420;--naver:#4fd18a;--coupang:#f0884f;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  .top{display:flex;justify-content:space-between;align-items:baseline}
  .brand{font-size:13px;letter-spacing:.2em;color:var(--sub)}
  .pagenav{display:flex;gap:6px;margin:10px 0 14px}
  .pagenav a{flex:1;text-align:center;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;text-decoration:none;font-size:15px}
  .pagenav a.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  label small{font-weight:400;color:var(--sub)}
  .field{margin-bottom:12px}
  input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
  textarea{resize:vertical;min-height:60px}
  .hintline{font-size:12px;min-height:18px;margin-top:4px}
  .qty{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);max-width:200px}
  .qty input{border:0;border-radius:0;text-align:center;font-weight:700}
  .qty button{border:0;background:transparent;color:var(--ink);width:48px;font-size:20px}
  .submit{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
  .submit:disabled{opacity:.5}
  .err{color:var(--bad);font-size:13px;margin-top:8px}
  .filter{display:flex;gap:6px;margin:16px 0 12px;flex-wrap:wrap}
  .fchip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px}
  .fchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .fchip b{font-weight:600;margin-left:4px;opacity:.7}
  .req.requested{border-left:5px solid var(--warn)}
  .req.bought{border-left:5px solid var(--accent)}
  .req.rejected{border-left:5px solid var(--bad)}
  .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .store{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
  .store.naver{color:var(--naver)} .store.coupang{color:var(--coupang)} .store.etc{color:var(--sub)}
  .qtyb{font-size:18px;font-weight:700;white-space:nowrap}
  .link{display:block;margin:6px 0 2px;color:var(--ink);font-weight:600;overflow-wrap:anywhere;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  .who{color:var(--sub);font-size:12px}
  .memo{margin-top:8px;font-size:13px;background:var(--bg);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
  .actions{display:flex;gap:6px;margin-top:10px}
  .btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px}
  .btn.done{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .btn.no{color:var(--bad)}
  .btn.del{flex:0 0 auto;padding:9px 12px;color:var(--sub)}
  .btn.del.sure{color:#fff;background:var(--bad);border-color:var(--bad)}
  .empty{text-align:center;color:var(--sub);padding:30px}
  .note{font-size:12px;color:var(--sub);text-align:center;margin-top:20px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">NARINSOOM · STAFF</div><span class="brand" id="clock"></span></div>
  <nav class="pagenav"><a href="./">입실 현황</a><a href="./purchase.html" class="on">🛒 구매요청</a></nav>

  <form class="card" id="form" novalidate>
    <div class="field">
      <label for="url">상품 링크 <small>네이버·쿠팡 주소 붙여넣기</small></label>
      <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://…">
      <div class="hintline" id="urlHint"></div>
    </div>
    <div class="field">
      <label for="qty">수량</label>
      <div class="qty"><button type="button" id="minus" aria-label="수량 줄이기">−</button><input id="qty" type="number" inputmode="numeric" min="1" max="999" value="1"><button type="button" id="plus" aria-label="수량 늘리기">+</button></div>
    </div>
    <div class="field">
      <label for="note">메모 <small>선택 · 물건 이름, 옵션, 용도</small></label>
      <textarea id="note" maxlength="300" placeholder="예: 주방세제 4L, 무향"></textarea>
    </div>
    <button class="submit" type="submit" id="submit">요청 보내기</button>
    <div class="err" id="formErr" hidden></div>
  </form>

  <div class="filter" id="filter"></div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
  <div class="note" id="updated"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/config.js"></script>
<script>
const sb = supabase.createClient(CONFIG.url, CONFIG.key);
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// 입실 현황 화면과 같은 기기 토큰 사용 → 없거나 만료되면 입실 현황(로그인)으로 보냄
const TOKEN_KEY = "narinsoom_staff_token";
let token = null; try { token = localStorage.getItem(TOKEN_KEY); } catch {}
const toLogin = () => { location.href = "./"; };
if(!token) toLogin();

const STATUS = { requested:"진행중", bought:"구매완료", rejected:"반려" };
const STORE = { naver:"네이버", coupang:"쿠팡", etc:"기타" };
let DATA = [], filter = "requested";
try { const f = localStorage.getItem("narinsoom_purchase_filter"); if(STATUS[f]) filter = f; } catch {}

function storeOf(u){
  try {
    const h = new URL(u).hostname.replace(/^www\./,"");
    if(/(^|\.)coupang\.com$|^coupa\.ng$/.test(h)) return "coupang";
    if(/(^|\.)naver\.com$|^naver\.me$/.test(h)) return "naver";
    return "etc";
  } catch { return null; }
}
// 목록에 보여줄 짧은 주소 (예: coupang.com/vp/products/123…)
function shortUrl(u){
  try { const x = new URL(u); const s = (x.hostname.replace(/^www\./,"") + x.pathname).replace(/\/$/,""); return s.length > 44 ? s.slice(0,43) + "…" : s; }
  catch { return u; }
}
const when = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }
function failed(error, what){
  if(String(error.message).includes("invalid_token")) return toLogin();
  toast(what + " 실패: " + error.message);
}

// ── 입력 ──
$("url").oninput = () => {
  const v = $("url").value.trim(), s = v ? storeOf(v) : null, h = $("urlHint");
  if(!v){ h.textContent = ""; return; }
  if(!s){ h.textContent = "https:// 로 시작하는 주소를 붙여 넣어 주세요"; h.style.color = "var(--bad)"; return; }
  h.textContent = s === "etc" ? "네이버·쿠팡 외 링크예요. 그대로 요청할 수 있어요." : STORE[s] + " 링크 확인됨";
  h.style.color = s === "naver" ? "var(--naver)" : s === "coupang" ? "var(--coupang)" : "var(--sub)";
};
const setQty = n => { $("qty").value = Math.min(999, Math.max(1, n|0 || 1)); };
$("minus").onclick = () => setQty(+$("qty").value - 1);
$("plus").onclick  = () => setQty(+$("qty").value + 1);
$("qty").onchange  = () => setQty(+$("qty").value);

$("form").onsubmit = async e => {
  e.preventDefault();
  const err = $("formErr"); err.hidden = true;
  const url = $("url").value.trim();
  if(!storeOf(url)){ err.textContent = "상품 링크를 https:// 로 시작하는 주소로 넣어 주세요."; err.hidden = false; $("url").focus(); return; }
  $("submit").disabled = true; $("submit").textContent = "보내는 중…";
  const { error } = await sb.rpc("staff_purchase_add", { p_token: token, p_url: url, p_qty: +$("qty").value || 1, p_note: $("note").value });
  $("submit").disabled = false; $("submit").textContent = "요청 보내기";
  if(error){
    if(String(error.message).includes("invalid_token")) return toLogin();
    err.textContent = error.message; err.hidden = false; return;
  }
  $("url").value = ""; $("note").value = ""; setQty(1); $("urlHint").textContent = "";
  toast("요청을 보냈습니다");
  filter = "requested"; load();
};

// ── 목록 ──
async function load(){
  const { data, error } = await sb.rpc("staff_purchase_list", { p_token: token });
  if(error) return failed(error, "불러오기");
  DATA = data || [];
  $("updated").textContent = `마지막 업데이트 ${new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})} · 1분마다 자동 새로고침`;
  render();
}

let sure = null;  // 삭제는 두 번 눌러야 함
function render(){
  const cnt = { requested:0, bought:0, rejected:0 };
  DATA.forEach(r => cnt[r.status]++);
  $("filter").innerHTML = Object.entries(STATUS).map(([k,l]) => `<button class="fchip ${k===filter?"on":""}" data-f="${k}">${l}<b>${cnt[k]}</b></button>`).join("");
  const shown = DATA.filter(r => r.status === filter);
  if(!shown.length){
    $("list").innerHTML = `<div class="empty">${filter==="requested" ? "진행중인 요청이 없습니다." : STATUS[filter] + "된 요청이 없습니다."}</div>`;
    return;
  }
  $("list").innerHTML = shown.map(r => {
    const href = /^https?:\/\//i.test(r.url) ? r.url : "#";
    const acts = r.status === "requested"
      ? `<button class="btn done" data-st="bought" data-id="${r.id}">구매완료</button><button class="btn no" data-st="rejected" data-id="${r.id}">반려</button>`
      : `<button class="btn" data-st="requested" data-id="${r.id}">진행중으로 되돌리기</button>`;
    return `<div class="card req ${r.status}">
      <div class="row1"><span class="store ${esc(r.store)}">${STORE[r.store] || "기타"}</span><span class="qtyb">${r.qty}개</span></div>
      <a class="link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(shortUrl(r.url))}</a>
      <div class="who">요청 ${when(r.created_at)}${r.status_at ? ` · ${STATUS[r.status]} ${when(r.status_at)}` : ""}</div>
      ${r.note ? `<div class="memo">💬 ${esc(r.note)}</div>` : ""}
      <div class="actions">${acts}<button class="btn del ${sure===r.id?"sure":""}" data-del="${r.id}">${sure===r.id?"정말 삭제":"삭제"}</button></div>
    </div>`;
  }).join("");
}

$("filter").onclick = e => {
  const b = e.target.closest(".fchip"); if(!b) return;
  filter = b.dataset.f; try { localStorage.setItem("narinsoom_purchase_filter", filter); } catch {}
  render();
};
$("list").onclick = async e => {
  const st = e.target.closest("[data-st]");
  if(st){
    const { error } = await sb.rpc("staff_purchase_set_status", { p_token: token, p_id: st.dataset.id, p_status: st.dataset.st });
    if(error) return failed(error, "저장");
    toast(st.dataset.st === "requested" ? "진행중으로 되돌렸습니다" : STATUS[st.dataset.st] + " 처리했습니다");
    return load();
  }
  const del = e.target.closest("[data-del]"); if(!del) return;
  if(sure !== del.dataset.del){ sure = del.dataset.del; render(); setTimeout(()=>{ if(sure===del.dataset.del){ sure=null; render(); } }, 4000); return; }
  sure = null;
  const { error } = await sb.rpc("staff_purchase_delete", { p_token: token, p_id: del.dataset.del });
  if(error) return failed(error, "삭제");
  toast("삭제했습니다"); load();
};

if(token) load();
setInterval(load, 60000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
const tick = () => { const d=new Date(); $("clock").textContent=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
